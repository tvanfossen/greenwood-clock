<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Clock</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 18px system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  /* The canvas is the viewport, one LVGL pixel per CSS pixel (sized by fitCanvas), so a
     touch maps 1:1 and the settings lay out for this phone, upright or sideways. */
  canvas { display: block; touch-action: none; }
  #note { display: none; max-width: 28em; padding: 1em; text-align: center; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<p id="note"></p>
<script>
  // Pairing: the clock's QR code opens this page with a one-time code after '#'. It is traded
  // for a session token (kept in this tab only) and removed from the address bar; then the
  // clock's state is fetched and the settings UI (panel.js) starts with it. ?mock: sample data.
  function note(text) {
    document.getElementById('canvas').style.display = 'none';
    const p = document.getElementById('note');
    p.textContent = text;
    p.style.display = 'block';
  }
  async function pair(code) {
    const r = await fetch('/api/pair', { method: 'POST', body: JSON.stringify({ code }) });
    if (!r.ok) return null;
    return (await r.json()).token;
  }
  // The canvas box follows the viewport; a change (the phone turned, the address bar went)
  // re-lays the settings out for the new size, a moment after it settles.
  function fitCanvas() {
    const c = document.getElementById('canvas');
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
  }
  let resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      fitCanvas();
      if (window.panelReady) Module._panel_resize(window.innerWidth, window.innerHeight);
    }, 150);
  });
  async function start() {
    const mock = new URLSearchParams(location.search).has('mock');
    const code = location.hash.slice(1);
    if (code) history.replaceState(null, '', location.pathname + location.search);
    let token = sessionStorage.getItem('clockToken');
    if (!mock && code) token = await pair(code);
    if (!mock && !token) return note('Scan the QR code on the clock (Settings › Phone) to connect.');
    if (!mock) {
      sessionStorage.setItem('clockToken', token);
      const r = await fetch('/api/panel', { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) {
        sessionStorage.removeItem('clockToken');
        return note('The session has ended. Scan the QR code on the clock again.');
      }
      window.panelState = await r.text();
      window.panelToken = token;
    }
    fitCanvas();
    window.Module = { canvas: document.getElementById('canvas'),
                      onRuntimeInitialized: function () { window.panelReady = true; } };
    const s = document.createElement('script');
    s.src = 'panel.js';
    document.body.appendChild(s);
  }
  // Upload (called from the settings UI): pick a picture, make it 1024x600 (a background is
  // cropped to fill; a photo is fitted whole over a blurred copy of itself), send it as PNG.
  const KINDS = ['background', 'photo'];
  function safeName(file) {
    const base = file.name.replace(/\.[^.]*$/, '').replace(/[^A-Za-z0-9_-]+/g, '_').slice(0, 40);
    return (base || 'picture') + '.png';
  }
  function draw(ctx, img, cover, blur) {
    const W = 1024, H = 600;
    const s = (cover ? Math.max : Math.min)(W / img.width, H / img.height);
    const w = img.width * s, h = img.height * s;
    ctx.filter = blur ? 'blur(24px)' : 'none';
    ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  }
  async function toPng(file, kind) {
    const img = await createImageBitmap(file);
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 600;
    const ctx = c.getContext('2d');
    draw(ctx, img, true, kind === 1);   // fill (blurred behind a photo)
    if (kind === 1) draw(ctx, img, false, false);
    return new Promise(res => c.toBlob(res, 'image/png'));
  }
  async function sendPicture(file, kind, token) {
    const name = safeName(file);
    const png = await toPng(file, kind);
    const r = await fetch('/api/upload?kind=' + KINDS[kind] + '&name=' + encodeURIComponent(name),
                          { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: png });
    const ok = r.ok;
    const msg = ok ? 'Sent: ' + name : (r.status === 401 ? 'Session ended: scan the code on the clock again'
                                                       : 'The clock refused it (' + r.status + ')');
    Module.ccall('panel_upload_done', null, ['number', 'string', 'string'], [ok ? 1 : 0, name, msg]);
  }
  window.panelUpload = function (kind, token) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = () => {
      if (input.files.length) sendPicture(input.files[0], kind, token).catch(e =>
        Module.ccall('panel_upload_done', null, ['number', 'string', 'string'], [0, '', String(e)]));
    };
    input.click();
  };
  start();
</script>
</body>
</html>
