<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Clock</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: grid; place-items: center; }
  /* The canvas box itself keeps the clock's 1024:600 shape, so a touch maps 1:1 to LVGL. */
  canvas { display: block; width: min(100vw, calc(100vh * 1024 / 600)); aspect-ratio: 1024 / 600;
           touch-action: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  var Module = { canvas: document.getElementById('canvas'),
                 onRuntimeInitialized: function () { window.panelReady = true; } };
</script>
<script src="panel.js"></script>
</body>
</html>
