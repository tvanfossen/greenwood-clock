# .clew.yaml — this repository's declarations for clew (tvanfossen/clew).
#
# `guard:` configures the `clew-guard` pre-commit gate. `requirements:` is the catalog the
# gate, the index and the wiki all read. Everything else is clew's index declarations, which
# the gate never reads.
requirements:
  file: docs/requirements.yaml
  format: yaml
  # Implemented in vendored code, which the gate does not read (REQ-NET-004 lives in the
  # esp_hosted patch): listed in the coverage report as exempt, not dropped.
  exempt_status: [vendored]

guard:
  validate:
    # Vendored / generated code only (vendored code is not held to the gate).
    exclude:
      - "build/**"
      - "managed_components/**"
      - "components/lvgl/**"
      - "components/cjson/**"
      - "re:^components/espressif__"
      - "components/display_fsm/src/stb_image.h"
      - "components/display_fsm/include/tinyfsm.hpp"
      - "components/fonts/**"
      - "components/images/**"
      - "tools/lottie_gen/glyph_animator/**"
      - ".venv/**"
      - "re:(^|/)\\.claude/"

    presence:
      require_doxygen: true
      require_return: true
      require_file_doxygen: true

    # The web control panel (sdcard/www/app.js) is first-party; gate its JSDoc too.
    languages:
      javascript: {}

    tags:
      req:
        pattern: "^REQ-[A-Z]+-[0-9]{3}$"

    version:
      require_present: true
      require_increment_on_change: true

  # Every function carries @req REQ-... from the catalog, or an honest exemption
  # (@utility shared/private helper, @callback framework-called).
  impact:
    report_dir: .claude/tmp/clew-guard/
