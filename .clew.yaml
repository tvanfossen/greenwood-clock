# .clew.yaml — this repository's declarations for clew (tvanfossen/clew).
#
# `guard:` configures the `clew-guard` pre-commit gate (doxygen-guard, absorbed
# into clew v1.3.0). Everything outside `guard:` is clew's index declarations,
# which the gate never reads.
guard:
  output_dir: .claude/tmp/clew-guard/

  validate:
    # Vendored / generated code only (vendored code is not held to the gate).
    exclude:
      - "^build/"
      - "^managed_components/"
      - "^components/lvgl/"
      - "^components/cjson/"
      - "^components/espressif__"
      - "^components/display_fsm/src/stb_image\\.h$"
      - "^components/display_fsm/include/tinyfsm\\.hpp$"
      - "^components/fonts/"
      - "^components/images/"
      - "^tools/lottie_gen/glyph_animator/"
      - "^\\.venv/"
      - "(^|/)\\.claude/"

    # `@p` is doxygen's inline parameter-reference command, used throughout
    # the existing C sources; clew-guard's vocabulary omits it.
    extra_tags: ["p"]

    presence:
      require_doxygen: true
      require_return: true
      require_file_doxygen: true

    # The web control panel (sdcard/www/app.js) is first-party; gate its JSDoc too.
    languages:
      javascript: {}

    tags:
      req:
        pattern: "^REQ-[A-Z]+-[0-9]{3}$"

    version:
      require_present: true
      require_increment_on_change: true

  # Every function carries @req REQ-... from this catalog, or an honest exemption
  # (@dg_internal private helper, @utility shared helper, @callback framework-called).
  impact:
    requirements:
      file: docs/requirements.yaml
      format: yaml
