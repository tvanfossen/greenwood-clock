# Vendored Espressif components (pristine registry copy + patches/*.patch) — not our source.
exclude: ^components/espressif__

repos:
  - repo: https://github.com/brandon-arrendondo/knots
    rev: v2.2.0
    hooks:
      - id: knots
        args:
          - --cognitive-threshold=15
        # Vendored / external code only — we hold our own source to the standard.
        exclude: ^(managed_components/|components/lvgl/|components/cjson/|components/fonts/|components/images/|components/display_fsm/src/stb_image\.h$)

  # Doxygen presence + @version gate (clew v2). Config is the `guard:` section of .clew.yaml.
  # Checks staged files only, so legacy undocumented code is documented as it is touched.
  - repo: https://github.com/tvanfossen/clew
    rev: v2.0.1
    hooks:
      - id: clew-guard
        files: \.(h|hpp|c|cpp|cc|py|js)$
        exclude: ^(build/|managed_components/|components/lvgl/|components/cjson/|components/fonts/|components/images/|components/display_fsm/src/stb_image\.h$|components/display_fsm/include/tinyfsm\.hpp$|tools/lottie_gen/glyph_animator/|\.venv/)|(^|/)\.claude/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # UI colours come from the theme (ui_theme roles, REQ-UI-003): no colour literal in the
  # firmware UI or the web panel outside the theme's own files.
  - repo: local
    hooks:
      - id: no-stray-colours
        name: no stray colours (use ui_theme roles)
        language: pygrep
        entry: 'lv_color_(hex|make|white|black)\(|lv_palette_(main|lighten|darken)\(|#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b'
        files: ^(main/|components/(display_fsm|http_api|lottie)/|sdcard/www/)
        exclude: ^components/display_fsm/(src/(ui_theme|ui_theme_json|ui_theme_lvgl|ui_contrast)\.c|src/stb_image\.h|include/tinyfsm\.hpp)$
